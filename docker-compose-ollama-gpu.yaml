version: "3.8"

services:
  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: ollama
    pull_policy: always
    tty: true
    restart: unless-stopped

    volumes:
      - ${BASE_PATH}/ollama/ollama:/root/.ollama

    ports:
      - "7869:11434"

    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1

    networks:
      - ollama-docker

    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: ollama-webui
    restart: unless-stopped

    depends_on:
      - ollama
      - searxng

    volumes:
      - ${BASE_PATH}/ollama/ollama-webui:/app/backend/data

    ports:
      - "${UI_PORT}:8080"

    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - ENV=dev
      - WEBUI_AUTH=${AUTH}
      - WEBUI_NAME=Homelab AI
      - WEBUI_URL=http://${HOST_URL}:${UI_PORT}
      - WEBUI_SECRET_KEY=${KEY}

      # ✅ Web Search (SearXNG)
      - ENABLE_RAG_WEB_SEARCH=true
      - RAG_WEB_SEARCH_ENGINE=searxng
      - SEARXNG_QUERY_URL=http://searxng:8080/search?q=<query>
      - RAG_WEB_SEARCH_RESULT_COUNT=5
      - RAG_WEB_SEARCH_CONCURRENT_REQUESTS=8

    networks:
      - ollama-docker

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped

    ports:
      - "${SEARCH_PORT}:8080"

    volumes:
      - ./searxng:/etc/searxng:rw

    environment:
      - BASE_URL=http://${HOST_URL}:${SEARCH_PORT}/
      - INSTANCE_NAME=searxng

    networks:
      - ollama-docker

networks:
  ollama-docker:
    driver: bridge
